name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Build AppImage
        run: ./packaging/build_linux.sh --appimage

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Neves Downloads ${{ steps.version.outputs.tag }}"
          body: |
            ## Neves Downloads ${{ steps.version.outputs.tag }}

            ### Instalação
            1. Baixe o arquivo `NevesDownloads-${{ steps.version.outputs.tag }}.AppImage`
            2. Torne executável: `chmod +x NevesDownloads-*.AppImage`
            3. Execute: `./NevesDownloads-*.AppImage`

            ### Atualização automática
            O aplicativo verifica automaticamente novas versões via GitHub Releases.
          files: |
            dist/NevesDownloads-*.AppImage
          draft: false
          prerelease: false
