# =============================================================================
# CI/CD do Neves Downloads
#
# Valida (lint + testes) a cada push/PR e gera os binários empacotados
# (Linux AppImage, Windows .exe e macOS .app/.dmg) e publica como Release.
#
# Eventos:
#   - push/PR:       roda testes, lint e mypy
#   - tag v*:        além disso, compila os binários e faz o upload para a
#                    Release correspondente à tag.
# =============================================================================

name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  # ── Qualidade de código ─────────────────────────────────────────────────────
  quality:
    name: Lint & Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Testes (pytest)
        run: python -m pytest -q

  # ── Build Linux (AppImage) ──────────────────────────────────────────────────
  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Build AppImage
        run: |
          # appimagetool exige libfuse2; instalamos e usamos extração.
          sudo apt-get update && sudo apt-get install -y libfuse2 || true
          ./packaging/build_linux.sh --appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NevesDownloads-Linux
          path: dist/*.AppImage

  # ── Build Windows (.exe) ────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      - name: Build .exe
        shell: cmd
        run: packaging\build_windows.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NevesDownloads-Windows
          path: dist/*.exe

  # ── Build macOS (.app / .dmg) ───────────────────────────────────────────────
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt
          brew install create-dmg || true

      - name: Build .app/.dmg
        run: ./packaging/build_macos.sh --dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NevesDownloads-macOS
          path: dist/*.dmg

  # ── Publicação de Release (somente em tags v*) ──────────────────────────────
  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organizar binários
        run: |
          mkdir -p release
          cp artifacts/NevesDownloads-Linux/*.AppImage release/ || true
          cp artifacts/NevesDownloads-Windows/*.exe release/ || true
          cp artifacts/NevesDownloads-Windows/*.zip release/ || true
          cp artifacts/NevesDownloads-macOS/*.dmg release/ || true

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
